[package]
name = "bookvault-desktop"
version = "0.1.0"
description = "BookVault desktop app (Tauri 2)"
authors = ["BookVault"]
edition = "2024"

[lib]
# lib 名与 bin 名分离是 Windows 的历史问题，见 rust-lang/cargo#8519
name = "bookvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
