[package]
name = "bookvault-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "BookVault NAS server (Axum + SQLite)"

[lib]
name = "bookvault_server"
path = "src/lib.rs"

[[bin]]
name = "bookvault-server"
path = "src/main.rs"

[dependencies]
bv-formats = { path = "../../crates/bv-formats" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
url = "2"
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
tower = "0.5.3"

[lints]
workspace = true
