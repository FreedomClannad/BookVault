[workspace]
resolver = "2"
members = [
    "crates/bv-formats",
    "crates/bv-protocol",
    "apps/desktop/src-tauri",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 自有 crate 一律：不写 unsafe、clippy 全量 deny
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# 桌面端发布优化（create-tauri-app 模板自带；member 不允许定义 profile，故放在根）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
